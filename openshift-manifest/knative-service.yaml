apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: usuario-serverless
spec:
  template:
    spec:
      containers:
        - image: richyortega/usuario-service:v6
          ports:
            - containerPort: 5081
          env:
            - name: APP_PORT
              value: '5081'
            - name: MONGO_URI
              value: 'mongodb://admin:admin123@mongodb:27017/usuario?authSource=admin'
